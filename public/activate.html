<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090d">
<title>Activar acceso · V/R Match</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 0,rgba(255,47,120,.18),transparent 34%),#09090d;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.box{width:min(570px,100%);background:#13131b;border:1px solid #2d2d39;border-radius:28px;padding:36px;box-shadow:0 35px 100px #0008}.brand{font-weight:950;letter-spacing:.08em}.brand b{background:linear-gradient(135deg,#ff2f78,#8c5cff);padding:9px;border-radius:10px;margin-right:8px}.kicker{font-size:11px;letter-spacing:.17em;color:#ff80aa;font-weight:900;margin-top:30px}h1{font-size:42px;line-height:1.05;letter-spacing:-.05em;margin:10px 0 12px}.muted{color:#aaa8b4;line-height:1.6}.form{display:grid;gap:14px;margin-top:22px}.form label{display:grid;gap:7px;font-size:13px;color:#d6d4db}.form input{width:100%;padding:14px;border-radius:13px;border:1px solid #30303c;background:#0c0c12;color:#fff}.check{grid-template-columns:auto 1fr!important;align-items:start}.check input{width:auto;margin-top:3px}.btn{width:100%;border:0;border-radius:13px;padding:15px;background:linear-gradient(135deg,#ff2f78,#ff5a76);color:#fff;font-weight:900;cursor:pointer}.error{color:#ff8eaa;font-size:13px}.ok{color:#95ffc1;font-size:13px}.recover{margin-top:22px;padding:17px;border:1px solid #343443;border-radius:16px;background:#0d0d13}.recover h3{margin:0 0 8px}.recover-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}.recover-row input{min-width:0;padding:13px;border-radius:11px;border:1px solid #30303c;background:#09090e;color:#fff}.recover-row button{border:0;border-radius:11px;padding:0 15px;background:#282833;color:#fff;font-weight:850;cursor:pointer}@media(max-width:520px){.box{padding:26px 20px}h1{font-size:34px}.recover-row{grid-template-columns:1fr}.recover-row button{padding:13px}}a{color:#ff7faa}</style>
</head>
<body>
<main class="box">
<div class="brand"><b>V/R</b>MATCH</div>
<div id="content"><p class="muted">Comprobando tu acceso…</p></div>
</main>
<script>
const $=s=>document.querySelector(s),token=new URLSearchParams(location.search).get('token')||'';let activation=null;
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function api(url,opt={}){const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Error del servidor');return d}
async function begin(){
  try{
    if(!token)throw new Error('Falta el token de activación.');
    activation=await api('/api/launch/activation/'+encodeURIComponent(token));
    const existing=activation.existingAccount;
    $('#content').innerHTML=`<div class="kicker">CIUDAD DESBLOQUEADA</div><h1>${esc(activation.city)} está abierta 🔓</h1>
    <p class="muted">${esc(activation.alias)}, tu acceso está listo para <strong>${esc(activation.email)}</strong>.</p>
    ${existing?`<p class="muted">Ya existe una cuenta con este correo. Este enlace puede iniciar una sesión segura sin pedirte la contraseña otra vez.</p>`:
    `<form id="activateForm" class="form"><label>Crea una contraseña<input id="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required placeholder="Mínimo 8 caracteres"></label>
    <label class="check"><input id="adult" type="checkbox" required><span>Confirmo que tengo 18 años o más.</span></label>
    <label class="check"><input id="terms" type="checkbox" required><span>Acepto las <a href="/terms.html" target="_blank">Condiciones</a> y la <a href="/privacy.html" target="_blank">Privacidad</a>.</span></label></form>`}
    <button id="go" class="btn" type="button">${existing?'Entrar en V/R Match':'Activar mi cuenta'}</button><div id="msg"></div>`;
    $('#go').onclick=activate;
  }catch(e){
    $('#content').innerHTML=`<div class="kicker">ACCESO</div><h1>Necesitas un nuevo enlace</h1>
    <p class="error">${esc(e.message)}</p>
    <p class="muted">Si tu ciudad ya está abierta y todavía no has activado la cuenta, podemos enviarte un enlace nuevo.</p>
    <div class="recover"><h3>Reenviar mi acceso</h3><p class="muted" style="font-size:13px;margin:0">Por privacidad, mostraremos el mismo mensaje exista o no una solicitud pendiente para ese correo.</p>
      <div class="recover-row"><input id="resendEmail" type="email" autocomplete="email" placeholder="tu@email.com"><button id="resendBtn" type="button">Reenviar</button></div>
      <div id="resendMsg"></div>
    </div>
    <p style="margin-top:20px"><a href="/">Ir a V/R Match</a> · <a href="/espera">Volver a la lista</a></p>`;
    $('#resendBtn').onclick=resendAccess;
  }
}
async function resendAccess(){
  const email=$('#resendEmail').value.trim(),btn=$('#resendBtn');
  if(!email){$('#resendMsg').innerHTML='<p class="error">Escribe tu correo.</p>';return}
  btn.disabled=true;
  try{
    const d=await api('/api/launch/resend-activation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
    $('#resendMsg').innerHTML=`<p class="ok">${esc(d.message||'Si tienes un acceso pendiente, recibirás un nuevo enlace.')}</p>`;
  }catch(e){
    $('#resendMsg').innerHTML='<p class="ok">Si ese correo tiene un acceso pendiente, recibirás un nuevo enlace en unos minutos.</p>';
  }finally{setTimeout(()=>{btn.disabled=false},1500)}
}
async function activate(){
  const btn=$('#go');btn.disabled=true;$('#msg').innerHTML='';
  try{
    const body={token};
    if(!activation.existingAccount){
      body.password=$('#password').value;body.confirmAdult=$('#adult').checked;body.acceptTerms=$('#terms').checked;
      if(body.password.length<8)throw new Error('La contraseña debe tener al menos 8 caracteres.');
      if(!body.confirmAdult||!body.acceptTerms)throw new Error('Confirma la edad y acepta las condiciones.');
    }
    const d=await api('/api/launch/activate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    localStorage.setItem('vr_auth_token',d.token);
    $('#msg').innerHTML='<p class="ok">Acceso activado. Entrando…</p>';
    setTimeout(()=>location.href=d.nextUrl||'/',500);
  }catch(e){$('#msg').innerHTML=`<p class="error">${esc(e.message)}</p>`;btn.disabled=false}
}
begin();
</script>
</body></html>
