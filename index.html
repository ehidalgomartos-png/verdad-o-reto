<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Verdad o Reto - Multijugador en Vivo</title>
  <style>
    body { margin: 0; background-color: #0d0d0d; color: #FFF; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .oculto { display: none !important; }
    .pantalla { background-color: #161616; padding: 30px; border-radius: 20px; width: 90%; max-width: 450px; box-shadow: 0 0 30px rgba(0, 194, 255, 0.1); border: 1px solid #333; box-sizing: border-box; text-align: center; }
    h1 { color: #FFF; margin-bottom: 5px; font-weight: 900; }
    p.subtitulo { color: #00C2FF; margin-bottom: 25px; font-weight: bold; }
    input[type="text"] { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #444; background-color: #222; color: #FFF; font-size: 16px; margin-bottom: 20px; box-sizing: border-box; }
    input:focus { outline: none; border-color: #FF005C; }
    
    button.btn-principal, a.btn-whatsapp { display: block; width: 100%; background-color: #00C2FF; color: #000; border: none; padding: 15px; font-size: 16px; font-weight: 900; border-radius: 30px; cursor: pointer; text-transform: uppercase; margin-bottom: 10px; text-decoration: none; box-sizing: border-box; }
    a.btn-whatsapp { background-color: #25D366; color: #FFF; }
    
    .grid-mazos { display: flex; flex-direction: column; gap: 15px; }
    .mazo { background-color: #1a1a1a; border-radius: 15px; padding: 15px; text-align: left; border: 2px solid #333; cursor: pointer; }
    .mazo-xx { border-color: #550020; }
    
    .tarjeta-reto { background-color: #251018; border: 2px solid #FF005C; padding: 20px; border-radius: 15px; margin-bottom: 25px; min-height: 100px; display: flex; align-items: center; justify-content: center; flex-direction: column; }
    .tarjeta-reto p { font-size: 18px; font-weight: bold; margin: 0; line-height: 1.4; }
    
    .botones-juego { display: flex; gap: 10px; margin-bottom: 20px; }
    .btn-verdad { flex: 1; background-color: #00C2FF; color: #000; border: none; padding: 15px; font-weight: 900; border-radius: 15px; cursor: pointer; font-size: 16px; }
    .btn-reto { flex: 1; background-color: #FF005C; color: #FFF; border: none; padding: 15px; font-weight: 900; border-radius: 15px; cursor: pointer; font-size: 16px; }
    .foto-upload { background-color: #222; border: 2px dashed #00C2FF; padding: 20px; border-radius: 10px; cursor: pointer; color: #00C2FF; font-weight: bold; }
  </style>
</head>
<body>

  <!-- PANTALLA PERFIL -->
  <div id="pantallaPerfil" class="pantalla">
    <h1 id="tituloPerfil">CREA TU PERFIL</h1>
    <p class="subtitulo">Prepara tus secretos</p>
    <form id="formularioPerfil">
      <input type="text" id="nombreUsuario" placeholder="Tu Apodo..." required>
      <button type="submit" class="btn-principal" id="btnPerfil">Continuar</button>
    </form>
  </div>

  <!-- PANTALLA MAZOS -->
  <div id="pantallaMazos" class="pantalla oculto">
    <h1>🔥 ELIGE TU VIBRA</h1>
    <p class="subtitulo">Selecciona el mazo</p>
    <div class="grid-mazos">
      <div class="mazo" onclick="crearSala('rompehielos')"><h3 style="color:#00C2FF; margin:0;">🧊 Rompehielos (Gratis)</h3></div>
      <div class="mazo mazo-xx" onclick="crearSala('seccionXX')"><h3 style="color:#FF005C; margin:0;">🔥 SECCIÓN XX (+18)</h3></div>
    </div>
  </div>

  <!-- MESA DE JUEGO -->
  <div id="pantallaJuego" class="pantalla oculto">
    <h1 id="tituloSala">⚔️ SALA SECRETA</h1>
    
    <div id="zonaInvitacion" class="oculto" style="margin-bottom: 20px;">
      <a href="#" id="btnWhatsApp" class="btn-whatsapp" target="_blank">📱 Invitar por WhatsApp</a>
    </div>

    <div class="tarjeta-reto">
      <p id="textoCarta">Esperando oponente...</p>
      <img id="imagenPrueba" src="" style="max-width: 100%; border-radius: 10px; margin-top: 15px; display: none;">
    </div>

    <!-- Controles para elegir carta (Solo se ven en tu turno) -->
    <div class="botones-juego oculto" id="controlesJuego">
      <button class="btn-verdad" onclick="jugarCarta('verdad')">VERDAD</button>
      <button class="btn-reto" onclick="jugarCarta('reto')">RETO</button>
    </div>

    <!-- Sección para subir la foto si te tocó un reto -->
    <div id="seccionPrueba" class="oculto">
      <div class="foto-upload" onclick="document.getElementById('inputPrueba').click()">📸 Sube tu foto de prueba</div>
      <input type="file" id="inputPrueba" accept="image/*" capture="environment" style="display: none;" onchange="subirFoto(this)">
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let miSala = '';
    let mazoElegido = 'rompehielos';
    let miTurno = false;

    const baseDeDatos = {
      rompehielos: {
        verdades: ["¿Cuál es tu talento más inútil?", "¿Qué es lo más vergonzoso que has buscado en Google?"],
        retos: ["Ponte un calcetín en la oreja y hazte un selfie.", "Saca una foto de lo que hay debajo de tu cama."]
      },
      seccionXX: {
        verdades: ["¿Cuál es tu fantasía inconfesable?", "¿Cuál ha sido tu mayor locura en una cita?"],
        retos: ["Besa tu mano y haz una foto.", "Hazte un selfie poniendo tu cara más provocativa."]
      }
    };

    const urlParams = new URLSearchParams(window.location.search);
    const salaInvitacion = urlParams.get('sala');

    if (salaInvitacion) {
      document.getElementById('tituloPerfil').innerText = "TE HAN RETADO";
      document.getElementById('btnPerfil').innerText = "Entrar a la Partida";
    }

    document.getElementById('formularioPerfil').addEventListener('submit', (e) => {
      e.preventDefault();
      document.getElementById('pantallaPerfil').classList.add('oculto');
      
      if (salaInvitacion) {
        miSala = salaInvitacion;
        socket.emit('unirse_sala', miSala);
        document.getElementById('pantallaJuego').classList.remove('oculto');
        document.getElementById('textoCarta').innerText = "Te uniste a la sala. Esperando a que el creador mueva ficha...";
        miTurno = false; // El invitado espera a que empiece el creador
      } else {
        document.getElementById('pantallaMazos').classList.remove('oculto');
      }
    });

    function crearSala(mazo) {
      mazoElegido = mazo;
      miSala = Math.random().toString(36).substring(2, 9);
      socket.emit('unirse_sala', miSala);
      
      document.getElementById('pantallaMazos').classList.add('oculto');
      document.getElementById('pantallaJuego').classList.remove('oculto');
      
      const enlace = `${window.location.origin}/?sala=${miSala}`;
      document.getElementById('zonaInvitacion').classList.remove('oculto');
      document.getElementById('btnWhatsApp').href = `https://api.whatsapp.com/send?text=¡Te reto a Verdad o Reto! Entra aquí: ${encodeURIComponent(enlace)}`;
      
      document.getElementById('textoCarta').innerText = "Mándale el enlace de WhatsApp a tu amigo y espera a que entre.";
      miTurno = false;
    }

    // Cuando el oponente entra a la sala
    socket.on('oponente_unido', () => {
      document.getElementById('zonaInvitacion').classList.add('oculto');
      document.getElementById('textoCarta').innerText = "¡Tu amigo se ha conectado! Te toca empezar el turno.";
      document.getElementById('controlesJuego').classList.remove('oculto');
      miTurno = true;
    });

    // 1. Jugador selecciona Verdad o Reto
    function jugarCarta(tipo) {
      document.getElementById('imagenPrueba').style.display = 'none';
      const cartas = baseDeDatos[mazoElegido][tipo === 'verdad' ? 'verdades' : 'retos'];
      const carta = cartas[Math.floor(Math.random() * cartas.length)];
      
      document.getElementById('textoCarta').innerText = `Has elegido ${tipo.toUpperCase()}:\n\n"${carta}"`;
      document.getElementById('controlesJuego').classList.add('oculto'); // Ocultar botones mientras juegas

      if (tipo === 'reto') {
        document.getElementById('textoCarta').innerText += "\n\n(Sube tu foto de prueba para continuar)";
        document.getElementById('seccionPrueba').classList.remove('oculto');
      } else {
        // Si es verdad, el turno pasa directamente al oponente
        miTurno = false;
      }

      // Enviar la acción al servidor para que el otro la vea
      socket.emit('accion_juego', { sala: miSala, tipo: tipo, textoCarta: carta });
    }

    // 2. El oponente recibe la carta que sacaste
    socket.on('actualizar_mesa', (datos) => {
      document.getElementById('imagenPrueba').style.display = 'none';
      document.getElementById('seccionPrueba').classList.add('oculto');
      
      document.getElementById('textoCarta').innerText = `Tu amigo eligió ${datos.tipo.toUpperCase()}:\n\n"${datos.textoCarta}"\n\n(Esperando su respuesta / foto de prueba...)`;
      document.getElementById('controlesJuego').classList.add('oculto');
    });

    // 3. Subir foto si te tocó un reto
    function subirFoto(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function (e) {
          const fotoBase64 = e.target.result;
          
          // Mostrar tu propia foto en pantalla
          document.getElementById('imagenPrueba').src = fotoBase64;
          document.getElementById('imagenPrueba').style.display = 'block';
          document.getElementById('textoCarta').innerText = "¡Has enviado tu foto de prueba con éxito! Ahora le toca al oponente.";
          document.getElementById('seccionPrueba').classList.add('oculto');

          // Enviar la foto al oponente
          socket.emit('enviar_foto', { sala: miSala, fotoBase64: fotoBase64 });
          
          // Permitir que el oponente tome el turno
          setTimeout(() => {
            document.getElementById('controlesJuego').classList.remove('oculto');
            document.getElementById('textoCarta').innerText = "¡Turno nuevo! Elige Verdad o Reto:";
          }, 3000);
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    // 4. El oponente recibe tu foto de prueba
    socket.on('recibir_foto', (fotoBase64) => {
      document.getElementById('textoCarta').innerText = "¡El oponente ha enviado la foto de prueba!";
      document.getElementById('imagenPrueba').src = fotoBase64;
      document.getElementById('imagenPrueba').style.display = 'block';

      // Ahora te toca jugar a ti
      setTimeout(() => {
        document.getElementById('textoCarta').innerText = "¡Es tu turno! Elige tu próxima jugada:";
        document.getElementById('controlesJuego').classList.remove('oculto');
      }, 3000);
    });
  </script>
</body>
</html>
