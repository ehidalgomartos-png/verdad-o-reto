<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V/R - Matchmaking en Vivo</title>
  <style>
    body { margin: 0; background-color: #0d0d0d; color: #FFF; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .oculto { display: none !important; }
    .pantalla { background-color: #121212; padding: 25px; border-radius: 24px; width: 90%; max-width: 400px; box-shadow: 0 0 30px rgba(0,0,0,0.8); border: 1px solid #222; box-sizing: border-box; text-align: center; }
    .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; font-weight: bold; font-size: 18px; color: #fff; }
    h1 { color: #FFF; margin-bottom: 5px; font-weight: 900; font-size: 24px; text-transform: uppercase; }
    p.subtitulo { color: #00C2FF; margin-bottom: 20px; font-weight: bold; font-size: 14px; }
    
    input[type="text"], input[type="number"] { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #333; background-color: #1a1a1a; color: #FFF; font-size: 16px; margin-bottom: 15px; box-sizing: border-box; }
    input:focus { outline: none; border-color: #FF005C; }
    label { display: block; text-align: left; font-size: 13px; color: #888; margin-bottom: 5px; font-weight: bold; }

    .menu-tarjeta { border-radius: 20px; padding: 25px 20px; text-align: left; cursor: pointer; margin-bottom: 15px; border: none; width: 100%; box-sizing: border-box; }
    .tarjeta-descubrir { background: linear-gradient(135deg, #FF005C 0%, #cc0046 100%); color: white; box-shadow: 0 8px 20px rgba(255,0,92,0.3); }
    .tarjeta-retar { background: linear-gradient(135deg, #0051ff 0%, #0033cc 100%); color: white; box-shadow: 0 8px 20px rgba(0,81,255,0.3); }
    .menu-tarjeta h2 { margin: 0 0 5px 0; font-size: 22px; font-weight: 900; }
    .menu-tarjeta p { margin: 0; font-size: 13px; opacity: 0.9; }

    /* Lista de jugadores en línea */
    .lista-jugadores { max-height: 250px; overflow-y: auto; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }
    .jugador-item { background-color: #1a1a1a; padding: 12px 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
    .btn-retar-user { background-color: #FF005C; color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px; }

    button.btn-principal, a.btn-whatsapp { display: block; width: 100%; background-color: #FF005C; color: white; border: none; padding: 15px; font-size: 16px; font-weight: 900; border-radius: 30px; cursor: pointer; text-transform: uppercase; margin-top: 10px; text-decoration: none; box-sizing: border-box; text-align: center; }
    a.btn-whatsapp { background-color: #25D366; }

    .tarjeta-reto { background-color: #1a1a1a; border: 2px solid #FF005C; padding: 20px; border-radius: 16px; margin-bottom: 20px; min-height: 90px; display: flex; align-items: center; justify-content: center; flex-direction: column; }
    .tarjeta-reto p { font-size: 16px; font-weight: bold; margin: 0; line-height: 1.4; }
    
    .botones-juego { display: flex; gap: 10px; margin-bottom: 15px; }
    .btn-verdad { flex: 1; background-color: #00C2FF; color: #000; border: none; padding: 15px; font-weight: 900; border-radius: 14px; cursor: pointer; font-size: 15px; }
    .btn-reto { flex: 1; background-color: #FF005C; color: #FFF; border: none; padding: 15px; font-weight: 900; border-radius: 14px; cursor: pointer; font-size: 15px; }
    .foto-upload { background-color: #1a1a1a; border: 2px dashed #00C2FF; padding: 15px; border-radius: 12px; cursor: pointer; color: #00C2FF; font-weight: bold; margin-bottom: 10px; }
  </style>
</head>
<body>

  <!-- PERFIL -->
  <div id="pantallaPerfil" class="pantalla">
    <div class="app-header"><span></span><span>V / R</span><span>🔔</span></div>
    <h1>Crea tu Perfil</h1>
    <p class="subtitulo">Prepara tus mejores secretos</p>
    <form id="formularioPerfil">
      <label>Nombre o Apodo</label>
      <input type="text" id="nombreUsuario" placeholder="Ej: Alex" required>
      <label>Edad</label>
      <input type="number" id="edadUsuario" placeholder="18" min="13" max="99" required>
      <button type="submit" class="btn-principal">Entrar a Jugar</button>
    </form>
  </div>

  <!-- MENÚ PRINCIPAL -->
  <div id="pantallaMenu" class="pantalla oculto">
    <div class="app-header"><span id="saludoHeader">Hola</span><span>V / R</span><span>🔔</span></div>
    <button class="menu-tarjeta tarjeta-descubrir" onclick="entrarLobbyDescubrir()">
      <h2>🔥 Descubrir</h2>
      <p>Elige a alguien en línea y desafíale</p>
    </button>
    <button class="menu-tarjeta tarjeta-retar" onclick="crearSalaWhatsApp()">
      <h2>👥 Retar Amigos</h2>
      <p>Crea sala privada y comparte enlace 🟢</p>
    </button>
  </div>

  <!-- PANTALLA LOBBY (LISTA DE ESPERA) -->
  <div id="pantallaLobby" class="pantalla oculto">
    <div class="app-header"><span onclick="volverMenu()" style="cursor:pointer;">⬅ Volver</span><span>LOBBY EN VIVO</span><span></span></div>
    <h1>Jugadores en Línea</h1>
    <p class="subtitulo">Selecciona a un rival para retarle</p>
    
    <div class="lista-jugadores" id="contenedorListaJugadores">
      <p style="color: #666; font-size: 14px;">Buscando jugadores...</p>
    </div>
  </div>

  <!-- MESA DE JUEGO -->
  <div id="pantallaJuego" class="pantalla oculto">
    <div class="app-header"><span onclick="volverMenu()" style="cursor:pointer;">❌ Salir</span><span>PARTIDA</span><span></span></div>
    
    <div id="zonaInvitacion" class="oculto" style="margin-bottom: 15px;">
      <a href="#" id="btnWhatsApp" class="btn-whatsapp" target="_blank">📱 Invitar por WhatsApp</a>
    </div>

    <div class="tarjeta-reto">
      <p id="textoCarta">Esperando oponente...</p>
      <img id="imagenPrueba" src="" style="max-width: 100%; border-radius: 12px; margin-top: 10px; display: none;">
    </div>

    <div id="seccionRespuesta" class="oculto">
      <input type="text" id="inputRespuesta" placeholder="Escribe tu respuesta...">
      <button class="btn-principal" onclick="enviarRespuestaTexto()">Enviar Respuesta</button>
    </div>

    <div id="seccionPrueba" class="oculto">
      <div class="foto-upload" onclick="document.getElementById('inputPrueba').click()">📸 Subir foto prueba del reto</div>
      <input type="file" id="inputPrueba" accept="image/*" capture="environment" style="display: none;" onchange="subirFoto(this)">
    </div>

    <div class="botones-juego oculto" id="controlesJuego">
      <button class="btn-verdad" onclick="jugarCarta('verdad')">VERDAD</button>
      <button class="btn-reto" onclick="jugarCarta('reto')">RETO</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let miSala = '';
    let mazoElegido = 'rompehielos';
    let miTurno = false;
    let nombreJugador = '';

    const baseDeDatos = {
      rompehielos: {
        verdades: ["¿Cuál es tu talento más inútil?", "¿Qué es lo más vergonzoso que has buscado en Google?", "¿Alguna vez has fingido una llamada para escapar?"],
        retos: ["Ponte un calcetín en la oreja y hazte un selfie.", "Saca una foto imitando tu emoji favorito."]
      }
    };

    const urlParams = new URLSearchParams(window.location.search);
    const salaInvitacion = urlParams.get('sala');

    document.getElementById('formularioPerfil').addEventListener('submit', (e) => {
      e.preventDefault();
      nombreJugador = document.getElementById('nombreUsuario').value;
      document.getElementById('saludoHeader').innerText = `Hola, ${nombreJugador}`;
      document.getElementById('pantallaPerfil').classList.add('oculto');

      if (salaInvitacion) {
        miSala = salaInvitacion;
        socket.emit('unirse_sala', miSala);
        document.getElementById('pantallaJuego').classList.remove('oculto');
        document.getElementById('textoCarta').innerText = "¡Te uniste a la sala! Esperando al creador...";
        miTurno = false;
      } else {
        document.getElementById('pantallaMenu').classList.remove('oculto');
      }
    });

    function volverMenu() {
      location.href = window.location.pathname;
    }

    // Entrar al Lobby para buscar contrincante
    function entrarLobbyDescubrir() {
      document.getElementById('pantallaMenu').classList.add('oculto');
      document.getElementById('pantallaLobby').classList.remove('oculto');
      socket.emit('entrar_lobby', nombreJugador);
    }

    // Escuchar la lista de jugadores en espera
    socket.on('actualizar_lista_espera', (lista) => {
      const contenedor = document.getElementById('contenedorListaJugadores');
      contenedor.innerHTML = '';

      // Filtrar para no mostrarse a uno mismo
      const otrosJugadores = lista.filter(j => j.id !== socket.id);

      if (otrosJugadores.length === 0) {
        contenedor.innerHTML = '<p style="color: #666; font-size: 14px;">No hay nadie esperando ahora mismo. ¡Espera a que alguien se conecte o rétalos por WhatsApp!</p>';
        return;
      }

      otrosJugadores.forEach(j => {
        const div = document.createElement('div');
        div.className = 'jugador-item';
        div.innerHTML = `
          <span style="font-weight:bold;">🟢 ${j.nombre}</span>
          <button class="btn-retar-user" onclick="retarUsuario('${j.id}')">Retar</button>
        `;
        contenedor.appendChild(div);
      });
    });

    function retarUsuario(idOponente) {
      socket.emit('retar_jugador', idOponente);
    }

    // Cuando el servidor empareja a dos jugadores
    socket.on('partida_iniciada', (datos) => {
      miSala = datos.salaID;
      document.getElementById('pantallaLobby').classList.add('oculto');
      document.getElementById('pantallaMenu').classList.add('oculto');
      document.getElementById('pantallaJuego').classList.remove('oculto');

      // Si tú iniciaste el reto, empiezas tu turno
      if (datos.creadorID === socket.id) {
        document.getElementById('textoCarta').innerText = "¡Match encontrado! Te toca empezar:";
        document.getElementById('controlesJuego').classList.remove('oculto');
        miTurno = true;
      } else {
        document.getElementById('textoCarta').innerText = "¡Match encontrado! El oponente está eligiendo...";
        miTurno = false;
      }
    });

    // Opción clásica de WhatsApp
    function crearSalaWhatsApp() {
      miSala = Math.random().toString(36).substring(2, 9);
      socket.emit('unirse_sala', miSala);
      document.getElementById('pantallaMenu').classList.add('oculto');
      document.getElementById('pantallaJuego').classList.remove('oculto');
      
      const enlace = `${window.location.origin}/?sala=${miSala}`;
      document.getElementById('zonaInvitacion').classList.remove('oculto');
      document.getElementById('btnWhatsApp').href = `https://api.whatsapp.com/send?text=¡Te reto a Verdad o Reto! Entra aquí: ${encodeURIComponent(enlace)}`;
      document.getElementById('textoCarta').innerText = "Mándale el WhatsApp a tu amigo y espera a que entre.";
      miTurno = false;
    }

    socket.on('oponente_unido', () => {
      document.getElementById('zonaInvitacion').classList.add('oculto');
      document.getElementById('textoCarta').innerText = "¡Tu amigo se ha conectado! Te toca empezar:";
      document.getElementById('controlesJuego').classList.remove('oculto');
      miTurno = true;
    });

    function jugarCarta(tipo) {
      if (!miTurno) return;
      document.getElementById('imagenPrueba').style.display = 'none';
      const cartas = baseDeDatos[mazoElegido][tipo === 'verdad' ? 'verdades' : 'retos'];
      const carta = cartas[Math.floor(Math.random() * cartas.length)];
      
      document.getElementById('controlesJuego').classList.add('oculto');

      if (tipo === 'verdad') {
        document.getElementById('textoCarta').innerText = `Te ha tocado VERDAD:\n\n"${carta}"\n\n(Responde abajo)`;
        document.getElementById('seccionRespuesta').classList.remove('oculto');
      } else {
        document.getElementById('textoCarta').innerText = `Te ha tocado RETO:\n\n"${carta}"\n\n(Sube tu foto de prueba)`;
        document.getElementById('seccionPrueba').classList.remove('oculto');
      }

      socket.emit('accion_juego', { sala: miSala, tipo: tipo, textoCarta: carta });
    }

    socket.on('actualizar_mesa', (datos) => {
      document.getElementById('imagenPrueba').style.display = 'none';
      document.getElementById('controlesJuego').classList.add('oculto');
      document.getElementById('seccionRespuesta').classList.add('oculto');
      document.getElementById('seccionPrueba').classList.add('oculto');
      miTurno = false;

      if (datos.tipo === 'verdad') {
        document.getElementById('textoCarta').innerText = `Tu oponente eligió VERDAD:\n\n"${datos.textoCarta}"\n\n(Esperando su respuesta...)`;
      } else {
        document.getElementById('textoCarta').innerText = `Tu oponente eligió RETO:\n\n"${datos.textoCarta}"\n\n(Esperando su foto de prueba...)`;
      }
    });

    function enviarRespuestaTexto() {
      const respuesta = document.getElementById('inputRespuesta').value;
      if (!respuesta) return;

      document.getElementById('textoCarta').innerText = `Tu respuesta: "${respuesta}"\n\n¡Enviado! Esperando al oponente...`;
      document.getElementById('seccionRespuesta').classList.add('oculto');
      document.getElementById('inputRespuesta').value = '';
      miTurno = false;

      socket.emit('enviar_respuesta', { sala: miSala, respuesta: respuesta });
    }

    socket.on('recibir_respuesta', (respuesta) => {
      document.getElementById('textoCarta').innerText = `El oponente respondió:\n\n"${respuesta}"\n\n¡Te toca jugar a ti!`;
      document.getElementById('controlesJuego').classList.remove('oculto');
      miTurno = true;
    });

    function subirFoto(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function (e) {
          const fotoBase64 = e.target.result;
          document.getElementById('imagenPrueba').src = fotoBase64;
          document.getElementById('imagenPrueba').style.display = 'block';
          document.getElementById('textoCarta').innerText = "¡Foto enviada! Esperando al oponente...";
          document.getElementById('seccionPrueba').classList.add('oculto');
          miTurno = false;

          socket.emit('enviar_foto', { sala: miSala, fotoBase64: fotoBase64 });
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    socket.on('recibir_foto', (fotoBase64) => {
      document.getElementById('textoCarta').innerText = "¡El oponente ha enviado la foto de prueba! Te toca jugar a ti:";
      document.getElementById('imagenPrueba').src = fotoBase64;
      document.getElementById('imagenPrueba').style.display = 'block';
      document.getElementById('controlesJuego').classList.remove('oculto');
      miTurno = true;
    });
  </script>
</body>
</html>
