services:
  - type: web
    name: vr-match
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VR_REQUIRE_EMAIL_VERIFICATION
        value: "false"
      - key: VR_LAUNCH_MODE
        value: beta
      - key: VR_ADMIN_EMAILS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: VR_MATCH_EMAIL_ENABLED
        value: "true"
      - key: VR_RETENTION_EMAIL_ENABLED
        value: "true"
      - key: VR_RETENTION_SWEEP_MINUTES
        value: "30"
      - key: VR_RETENTION_PROFILE_HOURS
        value: "24"
      - key: VR_RETENTION_MATCH_HOURS
        value: "18"
      - key: VR_RETENTION_MESSAGE_COOLDOWN_HOURS
        value: "6"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: VR_SMART_PUSH_ENABLED
        value: "true"
      - key: VR_SMART_PUSH_SWEEP_MINUTES
        value: "30"
      - key: VR_PUSH_DAILY_CAP
        value: "8"
      - key: VR_PUSH_SMART_DAILY_CAP
        value: "2"
      - key: VR_SYSTEM_ERROR_RETENTION_DAYS
        value: "30"
      - key: VR_HEALTH_MEMORY_WARN_MB
        value: "768"
